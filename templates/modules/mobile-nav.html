<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<nav th:fragment="mobileNav" 
     th:with="menu = ${menuFinder.getPrimary()}"
     class="md:hidden fixed bottom-0 left-0 w-full bg-white dark:bg-darkCard border-t border-gray-100 dark:border-darkBorder z-50 flex justify-around items-center py-3 pb-safe">
    
    <a th:each="menuItem : ${menu.menuItems}"
       th:href="@{${menuItem.status.href}}"
       class="mobile-nav-item flex flex-col items-center gap-1 transition text-gray-400 dark:text-gray-500 hover:text-blue-600 dark:hover:text-blue-400">
        
        <i class="ri-menu-line text-xl"></i>
        
        <span class="text-[10px]" th:text="${menuItem.status.displayName}">菜单</span>
    </a>
</nav>

</html>
