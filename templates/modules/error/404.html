<!DOCTYPE html>
<html lang="zh-CN" 
      xmlns:th="http://www.thymeleaf.org"
      th:replace="~{modules/layout :: html(content = ~{::content})}">

<th:block th:fragment="content">
<div class="min-h-screen flex flex-col items-center justify-center bg-gray-50 font-['Microsoft_YaHei',_sans-serif]">
    <!-- 核心容器：相对定位 + 响应式布局 -->
    <div class="relative text-center max-w-md w-full px-4">
        <!-- 宇航员图片：响应式宽度 -->
        <img 
            class="w-[180px] md:w-[220px] mx-auto" 
            th:src="@{/assets/img/xing.png}" 
            alt="迷路的宇航员"
        >
        <!-- 404数字：绝对定位 + 响应式大小 -->
        <div class="absolute right-1/4 md:right-1/5 top-1/4 text-7xl md:text-8xl font-bold text-gray-200">404</div>
    </div>

    <!-- 提示文字：响应式字号 -->
    <div class="mt-8 text-xl md:text-2xl text-gray-600">
        页面好像在宇宙中走失了...
    </div>

    <!-- 返回首页按钮：Tailwind样式 + Thymeleaf链接 -->
    <a 
        th:href="@{/}" 
        class="mt-6 px-8 py-3 bg-primary text-white rounded-lg hover:bg-primary/90 transition-colors cursor-pointer inline-block"
    >
        返回地球首页
    </a>
</div>
</th:block>
</html>
