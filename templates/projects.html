<!DOCTYPE html>
<html lang="zh-CN" 
      xmlns:th="http://www.thymeleaf.org"
      th:replace="~{modules/layout :: html(content = ~{::content})}"
      class="scroll-smooth">

<th:block th:fragment="content">
    <section class="animate-fade-in py-8">
        <div class="text-center mb-12 md:mb-16">
            <h2 class="text-5xl md:text-6xl font-art text-gray-900 dark:text-white tracking-wider">项 目</h2>
            <p class="text-gray-400 text-xs md:text-sm mt-4 tracking-widest uppercase">PORTFOLIO</p>
        </div>
        
        <div class="md:max-w-[1080px] mx-auto space-y-12 md:space-y-16">
            <div class="group">
                <div class="flex justify-between items-start mb-4">
                    <div>
                        <h3 class="text-xl md:text-2xl font-bold flex items-center gap-2 text-gray-900 dark:text-white group-hover:text-blue-600 dark:group-hover:text-blue-400 transition">
                            <i class="ri-shining-2-fill text-lg md:text-xl"></i>
                            <span>LUON Models 官网模板</span>
                        </h3>
                        <p class="font-mono text-gray-400 text-xs md:text-sm mt-1 ml-6 md:ml-8 tracking-wide">
                            LUON Models Template
                        </p>
                    </div>
                    <a href="#" class="w-8 h-8 md:w-10 md:h-10 rounded-full border border-gray-200 dark:border-gray-700 flex items-center justify-center text-gray-600 dark:text-gray-400 hover:bg-black hover:text-white dark:hover:bg-white dark:hover:text-black hover:border-black transition hover:rotate-45 duration-300">
                        <i class="ri-arrow-right-line text-lg"></i>
                    </a>
                </div>
                
                <div class="grid grid-cols-1 md:grid-cols-12 gap-4 mb-4">
                    <div class="md:col-span-4 overflow-hidden rounded-xl bg-gray-50 dark:bg-darkCard h-[160px] relative group-hover:shadow-md transition">
                        <img src="https://images.unsplash.com/photo-1481487484168-9b930d5b7960?q=80&w=800&auto=format&fit=crop" 
                             class="w-full h-full object-cover hover:scale-105 transition duration-700">
                        <div class="absolute bottom-2 left-3 text-white font-bold text-lg drop-shadow-md">
                            LUON MODELS.
                        </div>
                    </div>
                    <div class="md:col-span-4 flex items-center justify-center p-2 bg-gray-50 dark:bg-darkCard rounded-xl h-[160px] group-hover:shadow-md transition">
                        <img src="https://cdni.iconscout.com/illustration/premium/thumb/web-development-2974925-2477356.png" 
                             class="h-full object-contain drop-shadow-lg hover:-translate-y-1 transition duration-500">
                    </div>
                    <div class="md:col-span-4 overflow-hidden rounded-xl bg-gray-50 dark:bg-darkCard h-[160px] relative group-hover:shadow-md transition">
                        <img src="https://images.unsplash.com/photo-1558655146-d09347e92766?q=80&w=800&auto=format&fit=crop" 
                             class="w-full h-full object-cover hover:scale-105 transition duration-700">
                        <div class="absolute bottom-2 left-3 text-white font-bold text-lg drop-shadow-md">
                            IN THE RYE
                        </div>
                    </div>
                </div>
                
                <div class="flex justify-between items-end border-b border-gray-100 dark:border-darkBorder pb-8">
                    <div class="flex flex-wrap gap-2">
                        <span class="px-3 py-1 border border-gray-200 dark:border-gray-700 rounded-full text-[10px] font-bold text-gray-500 dark:text-gray-400 uppercase tracking-wide hover:bg-gray-50 dark:hover:bg-darkCard cursor-default">
                            Template
                        </span>
                        <span class="px-3 py-1 border border-gray-200 dark:border-gray-700 rounded-full text-[10px] font-bold text-gray-500 dark:text-gray-400 uppercase tracking-wide hover:bg-gray-50 dark:hover:bg-darkCard cursor-default">
                            Website
                        </span>
                    </div>
                    <span class="text-3xl font-bold text-gray-200 dark:text-gray-700 font-art group-hover:text-gray-800 dark:group-hover:text-gray-300 transition select-none">
                        2025
                    </span>
                </div>
            </div>
        </div>
    </section>
</th:block>
</html>
