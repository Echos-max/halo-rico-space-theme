<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org" th:replace="~{modules/layout :: html(content = ~{::content})}"
  class="scroll-smooth">
<th:block th:fragment="content">
  <th:block th:each="group : ${groups}">

    <!-- 
        布局容器：
        grid-cols-1: 手机单列
        sm:grid-cols-2: 平板双列
        lg:grid-cols-4: 大屏四列 (还原图片布局)
        gap-x-6 gap-y-10: 间距控制
    -->
    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-x-6 gap-y-10 w-full mb-12">

        <!-- 
            内层循环：遍历 links
            th:if="${linkStat.index < 2}": 【关键】只展示前两个
        -->
        <a th:each="link, linkStat : ${group.links}" 
           th:if="${linkStat.index < 2}"
           th:href="${link.spec.url}" 
           target="_blank"
           class="group flex flex-col cursor-pointer block">

            <!-- 1. 顶部元数据: - Category - ... (序号) -->
            <div class="flex justify-between items-center text-[10px] text-gray-500 mb-2 font-mono tracking-wide">
                <!-- 使用 group 的名称作为分类，例如 "- Web -" -->
                <span th:text="${'- ' + group.spec.displayName + ' -'}">- Category -</span>
                <!-- 模拟序号 (04x) -->
                <span th:text="${'(04' + (8 - linkStat.index) + ')'}">(000)</span>
            </div>

            <!-- 2. 图片区域 -->
            <div class="relative overflow-hidden rounded-lg mb-3 bg-gray-100">
                <!-- aspect-[4/3] 强制图片比例为 4:3 -->
                <img th:src="${link.spec.logo}" 
                     th:alt="${link.spec.displayName}"
                     class="w-full aspect-[4/3] object-cover transform group-hover:scale-105 transition-transform duration-500 ease-in-out" />
            </div>

            <!-- 3. 标题与图标 -->
            <div class="flex items-start justify-between gap-2">
                <div class="flex-1">
                    <h3 class="text-sm font-bold text-gray-900 leading-snug mb-1">
                        <!-- 蓝色推荐标签 (静态展示，如需动态可加 th:if) -->
                        <span class="bg-[#3b82f6] text-white text-[10px] px-1.5 py-0.5 rounded font-normal leading-none inline-block align-middle mr-1 transform -translate-y-[1px]">
                            推荐
                        </span>
                        <!-- 标题 -->
                        <span th:text="${link.spec.displayName}" class="align-middle hover:text-blue-600 transition-colors">
                            标题内容
                        </span>
                    </h3>
                </div>
                <!-- 右上角箭头图标 -->
                <svg class="w-3 h-3 text-gray-400 flex-shrink-0 mt-1 group-hover:text-blue-500 transition-colors" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 19L19 5M5 5h14v14"></path>
                </svg>
            </div>

            <!-- 4. 描述文本 -->
            <p th:text="${link.spec.description}" 
               class="text-xs text-gray-500 mt-1 leading-relaxed line-clamp-2">
               描述内容...
            </p>

        </a>

    </div>

</th:block>

</th:block>
</html>
