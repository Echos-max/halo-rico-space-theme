<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org" th:replace="~{modules/layout :: html(content = ~{::content})}"
  class="scroll-smooth">

<th:block th:fragment="content">
<main class="px-6 md:px-16 pb-24">
        <div class="columns-1 md:columns-2 lg:columns-3 gap-6 space-y-6">
            
            <!-- Thymeleaf 循环 -->
            <div th:each="photo : ${photoFinder.listAll()}" 
                 class="group relative break-inside-avoid cursor-zoom-in overflow-hidden rounded-sm"
                 id="photoCover"
                 >
                
                <img th:src="${photo.spec.url}" th:alt="${photo.spec.displayName}"
                     loading="lazy"
                     class="w-full block transform transition-all duration-700 ease-out grayscale-[20%] group-hover:grayscale-0 group-hover:scale-105">
                
                <div class="absolute inset-0 bg-gradient-to-t from-black/80 via-transparent to-transparent opacity-0 transition-opacity duration-500 group-hover:opacity-100"></div>
                
                <div class="absolute bottom-6 left-6 z-10 translate-y-4 opacity-0 transition-all duration-500 group-hover:translate-y-0 group-hover:opacity-100">
                    <h3 class="font-serif text-2xl text-white font-normal" 
                        th:text="${photo.spec.displayName}">Title</h3>
                    <p class="text-xs tracking-widest text-gray-300 mt-1 uppercase font-light" 
                       th:text="${photo.spec.description} ?: ''">Description</p>
                </div>
            </div>
        </div>
    </main>
</th:block>

</html>
