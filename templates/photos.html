<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org" th:replace="~{modules/layout :: html(content = ~{::content})}"
  class="scroll-smooth">

<th:block th:fragment="content">
  <main class="px-6 md:px-16 pb-24">
    <div class="columns-1 md:columns-2 lg:columns-3 gap-6 space-y-6">
    <div class="text-center mb-12 md:mb-16">
      <h2 class="text-5xl md:text-6xl font-art text-gray-900 dark:text-white tracking-wider">图库</h2>
      <p class="text-gray-400 text-xs md:text-sm mt-4 tracking-widest uppercase">PHOTOS</p>
    </div>
      <!-- Thymeleaf 循环 -->
      <div th:each="photo : ${photoFinder.listAll()}"
        class="group relative break-inside-avoid cursor-zoom-in overflow-hidden rounded-sm" 
        id="alumCovers"
        >
        <img th:src="${photo.spec.url}" th:alt="${photo.spec.displayName}" loading="lazy"
          class="w-full block transform transition-all duration-700 ease-out grayscale-[20%] group-hover:grayscale-0 group-hover:scale-105">
      </div>
    </div>
  </main>
</th:block>

</html>
