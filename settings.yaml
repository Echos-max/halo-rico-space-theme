apiVersion: v1alpha1
kind: Setting
metadata:
  name: theme-ricospace-setting
spec:
  forms:
    - group: HomeSettings
      label: 首页设置
      formSchema:
        - $formkit: attachment
          label: avatar_url
          help: 设置头像
          value:
        - $formkit: text
          name: titleLeft
          label: 首页标题第一个文字
          value : ""
        - $formkit: text
          name: subtitleLeft
          label: 首页标题第二个文字 
          value : 欢迎来到我的个人博客
        - $formkit: text
          name: titlebgLeft
          label: 首页标题第左侧第三个文字
          value : ""
        - $formkit: text
          name: titlebgRight
          label: 首页标题第右侧第四个文字
          value : ""
        - $formkit: text
          name: descriptionLeft
          label: 标题下的个人简介
          value : 这是一个使用 Rico Space 主题搭建的个人博客网站，分享我的技术文章和生活点滴。 
        - $formkit: array
          name: home_links
          label: 社交链接
          value:
            - value: bilibili
            - value: github
            - value: email
          itemLabels:
            - type: text
              label: $value.value
            - type: text
              label: $value.home_links_url
          children:
            - $formkit: select
              name: value
              label: 类型
              options:
                - label: 首页邮箱
                  value: email
                - label: 哔哩哔哩
                  value: bilibili
                - label: Github
                  value: github
                - label: Gitee
                  value: gitee
                - label: 少数派
                  value: shaoshupai
                - label: 掘金
                  value: juejin
                - label: CSDN
                  value: csdn
                - label: 知乎
                  value: zhihu

                - label: 微博链接
                  value: weibo
                - label: 微信（个人）
                  value: weixin
                - label: 微信公众号
                  value: weixin_mp
                - label: 小红书
                  value: xiaohongshu
                - label: 酷安
                  value: coolapk
                - label: 社区/论坛
                  value: community

                - label: 自定义
                  value: custom
                - $formkit: text
                  name: home_links_url
                  label: 链接
                - $formkit: attachment
                  if: '$value.value === "custom"'
                  name: custom_icon
                  label: 自定义图标
                  help: "请选择图标，推荐使用SVG格式图标。"
            - $formkit: text
              name: home_links_url
              label: 链接
              value :      
        - $formkit: text
          name: RightCover
          label: 首页右侧的背景图片地址
          value :

